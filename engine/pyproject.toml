[project]
name = "earshot-engine"
version = "0.1.0"
description = "On-device AI engine for Earshot: speech-to-text, knowledge-base search, reply + call notes."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy",
  "mlx-whisper",
  "mlx-vlm>=0.7",
  "sentence-transformers>=6.1",
  "torch",
  "torchvision", # EmbeddingGemma 2's processor imports it even in text-only mode
  "laya>=0.4.1",
]
